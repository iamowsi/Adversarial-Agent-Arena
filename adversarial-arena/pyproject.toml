[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adversarial-arena"
version = "0.1.0"
description = "Safe, sandboxed Adversarial Multi-Agent Arena MVP"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "httpx>=0.27.0"]

[project.scripts]
arena = "arena.cli:app"

[tool.setuptools.packages.find]
include = ["arena*"]
